<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Claude Skills</title>
  <desc id="desc">A curated hub for Claude, Claude Code, Codex, and other AI agent skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141413"/>
      <stop offset="55%" stop-color="#2a2622"/>
      <stop offset="100%" stop-color="#4b332a"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="22%" r="62%">
      <stop offset="0%" stop-color="#d97757" stop-opacity=".75"/>
      <stop offset="42%" stop-color="#d97757" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#faf9f5" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>

  <g opacity=".9" filter="url(#shadow)">
    <rect x="1125" y="68" width="300" height="74" rx="18" fill="#faf9f5" fill-opacity=".08" stroke="#faf9f5" stroke-opacity=".16"/>
    <rect x="1245" y="170" width="250" height="74" rx="18" fill="#d97757" fill-opacity=".12" stroke="#d97757" stroke-opacity=".3"/>
    <rect x="1065" y="268" width="280" height="74" rx="18" fill="#6a9bcc" fill-opacity=".10" stroke="#6a9bcc" stroke-opacity=".25"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" fill="#faf9f5">
    <text x="90" y="145" font-size="66" font-weight="800" letter-spacing="-1.5">Awesome Claude Skills</text>
    <text x="94" y="202" font-size="27" fill="#e8e6dc">A curated directory of skills, plugins &amp; agent tooling</text>
    <text x="94" y="246" font-size="23" fill="#b0aea5">Claude Code • Codex • Gemini CLI • Cursor • More</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">
    <g transform="translate(1156 91)">
      <circle cx="18" cy="18" r="18" fill="#d97757"/>
      <text x="50" y="26" fill="#faf9f5">Official</text>
    </g>
    <g transform="translate(1275 193)">
      <circle cx="18" cy="18" r="18" fill="#6a9bcc"/>
      <text x="50" y="26" fill="#faf9f5">Community</text>
    </g>
    <g transform="translate(1095 291)">
      <circle cx="18" cy="18" r="18" fill="#788c5d"/>
      <text x="50" y="26" fill="#faf9f5">Cross-agent</text>
    </g>
  </g>

  <text x="95" y="355" font-family="Inter, Arial, sans-serif" font-size="18" fill="#b0aea5">
    Curated for usefulness, maintenance, portability, and real-world value.
  </text>
</svg>
